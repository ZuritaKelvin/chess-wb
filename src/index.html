    <main>
      <header>
        <h1>Chess.js</h1>
      </header>
      <section id="quickMatch" aria-label="Opciones de partida">
        <label for="playerName">Tu nombre</label>
        <input id="playerName" maxlength="40" autocomplete="nickname" />
        <div class="gameModeButtons">
          <button id="playLocal" type="button">Jugar en local</button>
          <button id="findMatch" type="button">Rival aleatorio</button>
          <button id="createInvite" type="button">Crear invitación</button>
          <button id="cancelWaiting" type="button" hidden>Cancelar espera</button>
        </div>
        <div id="joinInviteControls">
          <label for="inviteCode">Código de invitación</label>
          <input id="inviteCode" maxlength="12" placeholder="12 caracteres" />
          <button id="joinInvite" type="button">Unirme</button>
        </div>
        <div id="inviteShare" hidden>
          <span>Código: <strong id="inviteCodeDisplay"></strong></span>
          <button id="copyInvite" type="button">Invitar por enlace</button>
        </div>
        <span id="matchStatus" role="status" aria-live="polite">Conectando…</span>
      </section>
      <dialog id="favDialog">
        <span> ¡Felicidades! Has ganado la partida. </span>
        <span id="winner"></span>
        <div
          style="
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 16px;
          "
        >
          <button id="restartGame">Reiniciar</button>
          <button id="closeDialog">Cerrar</button>
        </div>
      </dialog>

        <span>Player 2 (Black)</span>

            class="CapturedPieces"
            src="images/black-pawn.svg"
            alt="Peón negro"
          />
          <span id="BlackplayerScore">0</span>
        </div>
      </div>
